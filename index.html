<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaintPot Color Wheel</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; padding: 2rem; background: #f4f4f4; }
  .panel { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #wheelWrap { position: relative; width: 300px; height: 300px; }
  canvas { border-radius: 50%; cursor: crosshair; display: block; }
  #marker { position: absolute; width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 2px #000; transform: translate(-50%, -50%); pointer-events: none; }
  label { display: block; margin-top: 1rem; }
  input[type=range] { width: 300px; }
  #swatch { width: 100%; height: 100px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 1rem; }
  table { border-collapse: collapse; }
  td { padding: .35rem .75rem .35rem 0; }
  td:first-child { font-weight: 600; }
  code { font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div class="panel">
  <div id="wheelWrap">
    <canvas id="wheel" width="300" height="300"></canvas>
    <div id="marker"></div>
  </div>
  <label>Brightness <input type="range" id="value" min="0" max="100" value="100"></label>
</div>

<div class="panel">
  <div id="swatch"></div>
  <table>
    <tr><td>HEX</td><td><code id="hex"></code></td></tr>
    <tr><td>RGB</td><td><code id="rgb"></code></td></tr>
    <tr><td>HSL</td><td><code id="hsl"></code></td></tr>
    <tr><td>HSV</td><td><code id="hsv"></code></td></tr>
    <tr><td>CMYK</td><td><code id="cmyk"></code></td></tr>
    <tr><td>Complement</td><td><code id="comp"></code></td></tr>
    <tr><td>Text contrast</td><td><code id="contrast"></code></td></tr>
  </table>
</div>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const marker = document.getElementById('marker');
const valueSlider = document.getElementById('value');
const R = canvas.width / 2;
let hue = 0, sat = 0, val = 1;

function hsvToRgb(h, s, v) {
  const f = n => {
    const k = (n + h / 60) % 6;
    return v - v * s * Math.max(0, Math.min(k, 4 - k, 1));
  };
  return [f(5), f(3), f(1)].map(x => Math.round(x * 255));
}

function drawWheel() {
  const img = ctx.createImageData(canvas.width, canvas.height);
  for (let y = 0; y < canvas.height; y++) {
    for (let x = 0; x < canvas.width; x++) {
      const dx = x - R + 0.5, dy = y - R + 0.5;
      const d = Math.hypot(dx, dy);
      const i = (y * canvas.width + x) * 4;
      if (d > R) { img.data[i + 3] = 0; continue; }
      const h = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
      const [r, g, b] = hsvToRgb(h, d / R, val);
      img.data.set([r, g, b, 255], i);
    }
  }
  ctx.putImageData(img, 0, 0);
}

function update() {
  const [r, g, b] = hsvToRgb(hue, sat, val);
  const hex = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();

  const l = val * (1 - sat / 2);
  const sl = (l === 0 || l === 1) ? 0 : (val - l) / Math.min(l, 1 - l);

  const k = 1 - Math.max(r, g, b) / 255;
  const c = k === 1 ? 0 : (1 - r / 255 - k) / (1 - k);
  const m = k === 1 ? 0 : (1 - g / 255 - k) / (1 - k);
  const yy = k === 1 ? 0 : (1 - b / 255 - k) / (1 - k);

  const [cr, cg, cb] = hsvToRgb((hue + 180) % 360, sat, val);
  const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;

  const pct = x => Math.round(x * 100);
  document.getElementById('swatch').style.background = hex;
  document.getElementById('hex').textContent = hex;
  document.getElementById('rgb').textContent = `rgb(${r}, ${g}, ${b})`;
  document.getElementById('hsl').textContent = `hsl(${Math.round(hue)}, ${pct(sl)}%, ${pct(l)}%)`;
  document.getElementById('hsv').textContent = `hsv(${Math.round(hue)}, ${pct(sat)}%, ${pct(val)}%)`;
  document.getElementById('cmyk').textContent = `cmyk(${pct(c)}%, ${pct(m)}%, ${pct(yy)}%, ${pct(k)}%)`;
  document.getElementById('comp').textContent =
    '#' + [cr, cg, cb].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
  document.getElementById('contrast').textContent = lum > 0.5 ? 'Use dark text' : 'Use light text';

  const a = hue * Math.PI / 180;
  marker.style.left = (R + Math.cos(a) * sat * R) + 'px';
  marker.style.top = (R + Math.sin(a) * sat * R) + 'px';
}

function pick(e) {
  const rect = canvas.getBoundingClientRect();
  const dx = e.clientX - rect.left - R, dy = e.clientY - rect.top - R;
  hue = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
  sat = Math.min(1, Math.hypot(dx, dy) / R);
  update();
}

let dragging = false;
canvas.addEventListener('pointerdown', e => { dragging = true; canvas.setPointerCapture(e.pointerId); pick(e); });
canvas.addEventListener('pointermove', e => { if (dragging) pick(e); });
canvas.addEventListener('pointerup', () => dragging = false);
valueSlider.addEventListener('input', () => { val = valueSlider.value / 100; drawWheel(); update(); });

drawWheel();
update();
</script>
</body>
</html>
